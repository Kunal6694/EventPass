{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-4">
        <div class="card shadow p-4">
            <h3 class="fw-bold mb-3 text-center">Login to <span class="text-success">Portal</span></h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-prakrit w-100 py-2">Sign In</button>
            </form>
            <p class="text-center mt-3 small">New here? <a href="/register" class="text-success">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
