{% extends 'base.html' %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card p-4 shadow">
            <h5 class="fw-bold mb-3">Host New Event</h5>
            <form method="POST">
                <input type="text" name="title" class="form-control mb-2" placeholder="Event Name" required>
                <input type="date" name="date" class="form-control mb-2" required>
                <input type="text" name="location" class="form-control mb-2" placeholder="Venue Location" required>
                <!-- NEW: DESCRIPTION FIELD -->
                <textarea name="desc" class="form-control mb-2" rows="3" placeholder="Event Details & Benefits"></textarea>
                <input type="number" name="seats" class="form-control mb-2" placeholder="Total Capacity" required>
                <!-- NEW: PRICING FIELD -->
                <input type="number" name="price" class="form-control mb-3" placeholder="Price (₹)" required>
                <button type="submit" class="btn btn-success w-100 fw-bold">Publish to Marketplace</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card p-4 shadow-sm h-100">
            <h5 class="fw-bold mb-3 text-success">Management Pulse</h5>
            <table class="table small">
                <thead><tr><th>Event</th><th>Date</th><th>Seats</th><th>Price</th></tr></thead>
                <tbody>
                    {% for event in events %}
                    <tr><td>{{event.title}}</td><td>{{event.date}}</td><td>{{event.available_seats}}</td><td>₹{{event.price}}</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
